# Наименование конвейера, отображаемое в интерфейсе GitHub Actions
name: Build, Test and Publish

# События, при наступлении которых конвейер запускается
on:
  push:
    branches: [ main ]
    tags:
      # автоматическое создание выпуска по тегу вида v1.0.0
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # позволяет запускать конвейер вручную

jobs:
  build:
    # Наименование задания формируется с указанием операционной системы
    name: Сборка под управлением ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Отказ одного задания не прекращает выполнение остальных
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Шаг 1. Получение исходного кода из репозитория
      - name: Получение исходного кода
        uses: actions/checkout@v4

      # Шаг 2. Установка пакета средств разработки .NET
      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Шаг 3. Кэширование пакетов NuGet для сокращения времени сборки
      - name: Кэширование пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Шаг 4. Восстановление зависимостей решения
      - name: Восстановление зависимостей
        run: dotnet restore src/TranslationBureau.slnx

      # Шаг 5. Сборка решения в конфигурации Release
      - name: Сборка решения
        run: dotnet build src/TranslationBureau.slnx --configuration Release --no-restore

      # Шаг 6. Выполнение модульных тестов с отчётом о покрытии кода
      - name: Выполнение модульных тестов
        run: dotnet test src/TranslationBureau.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      # Шаг 7. Публикация отчёта о покрытии кода
      - name: Публикация отчёта о покрытии кода
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 30

      # Шаг 8. Публикация Web-приложения
      - name: Публикация приложения
        run: dotnet publish src/TranslationBureau.Web --configuration Release --no-build --output ./publish

      # Шаг 9. Сохранение результата публикации в качестве артефакта
      - name: Сохранение артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: TranslationBureau-${{ matrix.os }}
          path: ./publish/**
          retention-days: 30

  # Задание формирует самодостаточные пакеты развёртывания.
  # Каждая платформа сохраняется в качестве отдельного артефакта.
  self-contained:
    name: Самодостаточное развёртывание ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, linux-x64]

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кэширование пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Восстановление зависимостей
        run: dotnet restore src/TranslationBureau.slnx

      - name: Сборка решения
        run: dotnet build src/TranslationBureau.slnx --configuration Release --no-restore

      # Публикация самодостаточного пакета: среда выполнения включается
      # в состав пакета, поэтому целевой компьютер её не требует.
      - name: Публикация самодостаточного пакета
        run: >
          dotnet publish src/TranslationBureau.Web
          --configuration Release --no-build
          --runtime ${{ matrix.platform }} --self-contained true
          --output ./deploy/${{ matrix.platform }}

      - name: Сохранение пакета развёртывания
        uses: actions/upload-artifact@v4
        with:
          name: TranslationBureau-${{ matrix.platform }}-self-contained
          path: ./deploy/${{ matrix.platform }}/**
          retention-days: 30

  # Задание собирает образ контейнера с Web-приложением.
  docker:
    name: Сборка образа контейнера
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: translationbureau:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Задание создаёт выпуск и прикрепляет к нему пакеты развёртывания.
  # Запускается только при добавлении тега, наименование которого начинается с v.
  release:
    name: Создание выпуска
    runs-on: ubuntu-latest
    needs: [build, self-contained]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Получение сформированных артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Формирование выпуска
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TranslationBureau-ubuntu-latest/**
            artifacts/TranslationBureau-windows-latest/**
            artifacts/TranslationBureau-win-x64-self-contained/**
            artifacts/TranslationBureau-linux-x64-self-contained/**
          fail_on_unmatched_files: false
          generate_release_notes: true